# Team / enterprise overrides for the bmad-build skill.
# Committed to the repo — applies to every developer on the project.
# Merges over .claude/skills/bmad-build/customize.toml, which is the shipped
# default and carries "DO NOT EDIT -- overwritten on every update".
# Scalars override; tables deep-merge; arrays append.

[workflow]

# Standing facts every build run carries, as planning-time requirements.
#
# Added 2026-09-01 after two consecutive `bad_spec` loops of the same species.
# Story 1.2's tasks asked only for negative assertions ("no literal escapes, no
# shadow, both floors hold") — every one of which an empty implementation
# satisfies. Story 1.3's tasks named the files to test but never required that a
# value produced in one module be observed at the module consuming it, so three
# mutations passed a 263-test suite: the composition root handing the server the
# wrong project, every type-role application deleted from the stylesheet, and two
# of five entries removed from the escaping table.
#
# The pattern in all three is the same, and it is not specific to this project:
# tests written from a task list assert the thing the task names, at the place the
# task names it. What goes unasserted is the join.
#
# Amended 2026-09-01 after a THIRD occurrence, which the first version of this
# rule did not prevent: it was written about values, and the next story broke it
# on wiring instead. A rule that names one shape of a recurring failure gets
# applied to that shape and no further. These entries exist so the
# requirement is inherited at planning time rather than rediscovered from the
# shape of the last failure.
persistent_facts = [
  "VERIFICATION STANDARD — every spec's task list must require assertions in both directions, and the planning step must not present a spec that does not. (1) POSITIVE AND NEGATIVE: a negative assertion (no literal, no shadow, no script, nothing outside a set) is satisfied by an empty implementation and therefore cannot distinguish correct work from missing work. Every negative assertion is paired with a positive one naming what the artifact does produce. (2) ACROSS SEAMS: where a value is produced in one module and consumed in another, at least one test observes it at the CONSUMING end. Asserting it where it is created and again where it is rendered, with nothing crossing the join, leaves the join untested — which is where it silently breaks. This covers WIRING as well as values: the composition root's choice of which implementation to inject is itself a seam, and the one that decides whether a feature exists at all. Making a dependency required only catches omission — substituting it for something inert is invisible to the type system, so at least one test must observe that the real implementation is the one actually reached. This clause was added after the value half of this rule was written and the wiring half was broken in the very next story: replacing the browser launcher at the composition root with a no-op passed all 311 tests, so the story's headline feature could have stopped working entirely with a green suite. (3) EVERY NEW MODULE GETS A TEST FILE, including modules added during implementation that the Code Map never anticipated; a module whose own doc comment argues for its existence is not thereby verified. (4) DEAD-END CHECKS: a named thing the artifact emits must be matched by the rule, handler or consumer that acts on it, checked in both directions — emitted-but-unhandled and handled-but-never-emitted are both defects.",

  "EVIDENCE STANDARD — a value is not verified because it is plausible. This project has repeatedly shipped values asserted rather than observed: contrast ratios from plausibility, library versions from an article, marker counts from the wrong source, a bound address read from our own variable, task boxes trusted because they were ticked, string edits assumed to have applied. Compute, read from the source of truth, or run it. Where a document states a number that code depends on, a test recomputes it from the code's own inputs and fails when the document and the code disagree. Where a specified string must appear verbatim, the test reads the specifying document rather than holding a second copy of the string.",

  "MUTATION AS THE STANDARD OF EVIDENCE — before marking a spec's tasks complete, break each invariant the story claims to enforce and confirm the suite fails. A test that passes proves nothing about what it would catch. Record which mutations were run and what failed. Prefer deterministic assertions over probabilistic ones: where a race or an ordering is the risk, assert the order of observable events rather than sampling a timing window, because a defect present 16% of the time passes a sixteen-run check most of the time.",

  "TASK LEDGER HONESTY — verify each task line against the code before ticking it, not against your own report of having done it, and not against a proxy you chose after the fact. MECHANICALLY: a task line names a file in backticks; before ticking it, confirm THAT FILE appears in the diff since the baseline commit. `scripts/check-tasks.ts` does this and must be run before any spec's tasks are marked complete. This clause exists because the story immediately after this standing fact was written ticked two tasks whose files were never touched — the verification script that was supposed to catch it grepped a *different* file for an adjacent-looking string and passed, which is the same asserted-rather-than-observed failure applied to the act of verifying. Two false ticks reached a completed story in this project (a signal handler that was never registered, request bodies that were never drained). Where the implementation deliberately diverges from a task line, amend the line to describe what was built and why, rather than ticking a claim that is not true.",

  "COMMIT ATTRIBUTION — every commit this workflow creates carries a `Story: <key>` trailer naming the sprint-status story key it belongs to, e.g. `Story: 1-7-identify-what-each-artifact-is`. The subject line stays readable prose; the trailer is what a machine reads. Added 2026-09-03 from the Epic 1 retrospective (item 10): the retro's `git_evidence.py` pre-pass returned `stories: []` for all 25 commits against all 13 story ids, because nothing in a prose subject names a story, so change volume could not be attributed and had to be hand-mapped. This is a standing fact rather than a workflow key because bmad-build's `customize.toml` exposes nothing commit-related and `step-05-present.md` is a shipped file. MECHANICALLY, learned 2026-09-04 on this fact's first use: git parses only the **last** contiguous block of `Key: value` lines as trailers, so a blank line between `Story:` and `Co-Authored-By:` silently drops `Story:` from `%(trailers)` while the commit still looks correct to a human reader. Put every trailer in one block with no blank line between them, and verify with `git log -1 --format='%(trailers:key=Story,valueonly)'` — which returns empty when the trailer did not parse. An unverified trailer is the same defect this item was raised to fix.",

  "MATRIX COMPLETENESS — before presenting a spec, cross the I/O matrix's own dimensions and name every combination that has no row. Each is then either given a row or explicitly stated to be impossible, with the reason. Added 2026-09-03 from the Epic 1 retrospective (item 12): three of the epic's later stories had their principal defect in a combination the matrix never enumerated, while every enumerated row was built correctly — 1.8's suppression cap (a row for the alias case, none for the cap overflowing), 1.9's interpretation of an artifact that is not present (a row for recognized-but-uninterpretable, none for absent), and 1.10's slug leak at the heading and title levels (rows for every name-based case, none for a declared or structural one). The rows that get written get built; the combinations left out are where the defects land.",
]

# The verification-gap reviewer, with one check added.
#
# Keyed arrays of tables merge by `id`, and `instruction` is a scalar inside the
# table — so this entry replaces the shipped one wholesale and has to carry its
# whole instruction, not just the addition. The only difference from the shipped
# text is the paragraph beginning "One check in addition".
#
# Added 2026-09-03 from the Epic 1 retrospective (item 11). A comment asserting a
# mechanism the code does not enforce was the dominant defect class across all
# eleven review rounds of the epic — seven instances, found one at a time rather
# than as a class:
#   - `ChildStage` documented as "pinned as a subset by the typecheck", which it
#     was not: the stages were inline literals the type never saw.
#   - `LEVEL_LABELS` documented as "pinned against the index", by a test that
#     compared them to a literal typed into the test file.
#   - `INVENTORY_BUDGET`'s bounds called "roughly two orders of magnitude clear",
#     where one of the two was 2.4x.
#   - "Nothing outside the root is touched at any point", while the same function
#     issued a readlink on /etc through an in-root symlink.
#   - Three separate comments stating that a page load builds a new snapshot,
#     while the served page was frozen at bind time for the life of the socket.
# The check is cheap and the question is always the same one.
[[workflow.review_layers]]
id = "verification-gap"
name = "Verification Gap Reviewer"
instruction = """
Launch a context-free subagent with this prompt:

Read `{skill-root}/review-prompts/verification-gap.md` completely and follow it as your review instructions.

One check in addition to that file's own method. Where a comment, doc block or type documents a *mechanism* — that something is pinned by the typecheck, enforced by a gate, read out of a named document rather than copied, total by construction, or cannot happen for a stated reason — identify the test that fails if that mechanism is removed. Name it. If no test fails, the claim is unenforced and that is the finding, whether or not the code currently behaves correctly: the comment tells a future reader that a guarantee exists, and the next edit will rely on it.

Review content:

{diff_output}

Do not invoke any skill. If the instruction file is unreadable, report that exact failure and stop. Return only the review result.

"""
